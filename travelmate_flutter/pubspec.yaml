name: travelmate_ai
description: An Advanced AI-Powered Smart Tourist Exploration, Navigation and Travel Assistance Platform.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.0
  google_maps_flutter: ^2.6.0
  geolocator: ^11.0.0
  sensors_plus: ^5.0.1
  camera: ^0.10.5+9
  flutter_tts: ^4.0.2
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.5
  provider: ^6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
